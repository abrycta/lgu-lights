<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Old host (lgu.krtmtthw.dev) -> lights.krtmtthw.dev. -->
    <script src="/host-redirect.js"></script>
    <!-- Akari pre-paint theme: the shared krtmtthw.dev cookie (or localStorage) before first paint. External, so CSP-safe. -->
    <script src="/theme-init.js" data-shared-cookie-domain="krtmtthw.dev"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <!-- The data pointer is on the critical path of every page (same origin, so no preconnect is needed in M1). -->
    <link rel="preload" href="/data/latest.json" as="fetch" crossorigin="anonymous" />
    <!-- data-preload: scripts/deploy-web.sh puts the current version's manifest, index and tiles-attrs.csv here -->
    <meta name="description" content="Poverty incidence for every Philippine city and municipality, 2012–2025: PSA official estimates and clearly labelled model estimates from PSA history and satellite data." />
    <title>Lights</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lights" />
    <meta property="og:title" content="Lights: poverty in every Philippine city and municipality" />
    <meta property="og:description" content="PSA official poverty estimates for 2012–2025, with clearly labelled model estimates from PSA history and satellite data for the years between." />
    <meta property="og:url" content="https://lights.krtmtthw.dev/" />
    <meta property="og:image" content="https://lights.krtmtthw.dev/og-card-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lights: a map of poverty incidence across the Philippines" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
