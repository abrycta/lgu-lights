<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The embed krtmtthw.dev frames: a short 2023 tour of places chosen from the data (src/embed/tour-select.ts). -->
    <script src="/theme-init.js" data-shared-cookie-domain="krtmtthw.dev"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- embed-pack (written by scripts/build-embed.mjs) -->
    <link rel="preload" href="/embed-data/lights-4f2335d43157.json" as="fetch" crossorigin="anonymous" media="(min-width: 1101px)" />
    <link rel="preload" href="/embed-data/lights-medium-4d0552331e8b.json" as="fetch" crossorigin="anonymous" media="(min-width: 601px) and (max-width: 1100px)" />
    <link rel="preload" href="/embed-data/lights-small-c642030f318d.json" as="fetch" crossorigin="anonymous" media="(max-width: 600px)" />
    <!-- /embed-pack -->
    <!-- Pre-load still: the project's kanji glyph, the same quiet tile as krtmtthw.dev's embed slots (Akari muted tokens),
      until the view is ready. Over the page until the first full frame is drawn (html[data-embed-ready]). -->
    <style>
      .glyph-seal {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: var(--muted, #efede7);
        color: var(--muted-foreground, #6b6a66);
        font-family: var(--font-heading, "Hiragino Mincho ProN", "Yu Mincho", serif);
        font-size: clamp(48px, 9vw, 80px);
        font-weight: 700;
        line-height: 1;
        pointer-events: none;
      }
      html[data-embed-ready] .glyph-seal {
        display: none;
      }
    </style>
    <title>Lights (embed)</title>
  </head>
  <body>
    <div class="glyph-seal" aria-hidden="true" lang="ja">光</div>
    <div id="root"></div>
    <script type="module" src="/src/embed/main.tsx"></script>
  </body>
</html>
