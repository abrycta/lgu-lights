# Dependency updates (Dependabot). Version updates: weekly, one grouped PR per ecosystem, at most 2 open.
# Security updates are separate and immediate (repo setting: Dependabot security updates).
# Majors of react, react-dom, astro, vite and maplibre-gl, and @abrycta/* (Akari, portfolio rule 23),
# are upgraded by hand.
version: 2
registries:
  # @abrycta/akari comes from GitHub Packages. Dependabot secret DEPENDABOT_PACKAGES_TOKEN: a classic
  # personal access token with read:packages only.
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    # Dependabot needs the scope (or a committed .npmrc); without it every npm job fails with private_registry_config_not_found.
    scope: "@abrycta"
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}
updates:
  - package-ecosystem: npm
    directories: ["/web"]
    registries: [github-packages]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "@abrycta/*"
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: maplibre-gl
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler) has no JS API yet, so typescript-eslint (peer <6.1) cannot
      # run on it. Stay on 6.x until typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
