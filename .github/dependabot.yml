# Dependency updates (Dependabot, portfolio MAINTAINING.md rule 24). Every ecosystem and directory
# with a lockfile is covered. Version updates: weekly, minor and patch grouped into one PR per
# directory; majors come one PR each (or are ignored below). Security fixes come as their own grouped
# PR per directory (repo setting: Dependabot security updates). Few open PRs: 2 for the app, CI and
# pipeline.
# @abrycta/* (Akari) is upgraded by hand, one PR per release (portfolio rule 16). Majors of react,
# react-dom, astro, vite, maplibre-gl, typescript and @types/node are upgraded by hand too.
version: 2
registries:
  # @abrycta/akari comes from GitHub Packages. Dependabot secret DEPENDABOT_PACKAGES_TOKEN: a classic
  # personal access token with read:packages only.
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    # Dependabot needs the scope (or a committed .npmrc); without it every npm job fails with private_registry_config_not_found.
    scope: "@abrycta"
    token: ${{secrets.DEPENDABOT_PACKAGES_TOKEN}}
  # archivekit (pipeline/pyproject.toml) is a git dependency on the private abrycta/data-archive-kit.
  # Dependabot secret ARCHIVE_GIT_TOKEN: a fine-grained token with read-only Contents on that repo.
  archive-kit-git:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.ARCHIVE_GIT_TOKEN}}
updates:
  # The app (web/).
  - package-ecosystem: npm
    directories: ["/web"]
    registries: [github-packages]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "@abrycta/*"
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: astro
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: maplibre-gl
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler) has no JS API yet, so typescript-eslint (peer <6.1) cannot
      # run on it. Stay on 6.x until typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # CI and the deploys run Node 24: keep @types/node on 24.x so the types match the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The Rust workspace (crates/, including the WebAssembly crate the app loads).
  - package-ecosystem: cargo
    directories: ["/"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The data pipeline and model training (uv).
  - package-ecosystem: uv
    directories: ["/pipeline"]
    registries: [archive-kit-git]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # CI workflows and the local composite action.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Manila }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

