# Web app: install (private @abrycta/akari from GitHub Packages), typecheck, unit tests, build, size report.
# The WASM module and the data are runtime assets (built by rust.yml / data.yml), not part of the checks.
#
# Deploy (portfolio rule 17): on main, after `check` passes (and Rust CI, when the commit has a Rust run),
# scripts/deploy-web.sh builds the app with the WASM module, adds the published data versions from their
# GitHub releases (checksums verified), deploys to Cloudflare Pages and checks the live site. To publish a
# new data release, set DATA_VERSIONS / LATEST in the script and push, or run this workflow on main.
name: Web

on:
  push:
    paths: [web/**, scripts/deploy-web.sh, .github/workflows/web.yml, crates/**, Cargo.toml, Cargo.lock, rust-toolchain.toml]
  pull_request:
    paths: [web/**, scripts/deploy-web.sh, .github/workflows/web.yml, crates/**, Cargo.toml, Cargo.lock, rust-toolchain.toml]
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # @abrycta/akari; the package must grant this repository read access (Package settings)

# Branches: a newer push cancels the older run. main: never cancelled (a deploy is never cut off midway);
# while one runs, only the newest pending run is kept, so stacked pushes deploy just the newest commit.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@abrycta"
      - run: npm ci
        env: { NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build
      - run: npm run e2e:install
      - run: npm run e2e
      - name: Size
        run: |
          {
            echo "### Bundle (gzipped)"
            for f in dist/assets/*.js dist/assets/*.css; do echo "$(gzip -9c "$f" | wc -c) $(basename "$f")"; done | sort -rn
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read   # data-<v> release assets
      actions: read    # Rust CI's result for this commit
      packages: read   # @abrycta/akari
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust CI passed for this commit (when it ran)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/rust.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
            if [ -z "$run" ]; then echo "No Rust CI run for this commit (no Rust change)."; exit 0; fi
            read -r status conclusion url <<<"$run"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] || { echo "::error title=Rust CI is red::$url ($conclusion); not deploying."; exit 1; }
              echo "Rust CI passed: $url"; exit 0
            fi
            echo "Rust CI is $status, waiting ($i/60)"; sleep 20
          done
          echo "::error::Rust CI did not finish in 20 minutes"; exit 1
      - uses: ./.github/actions/setup-rust
        with: { key: wasm }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@abrycta"
      - run: npm ci
        working-directory: web
        env: { NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build, add the data, deploy, check live
        run: scripts/deploy-web.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
      - name: Summary
        run: |
          {
            echo "### Deployed \`${GITHUB_SHA:0:7}\` to https://lights.krtmtthw.dev"
            echo "latest.json: $(curl -fsS "https://lights.krtmtthw.dev/data/latest.json?t=$(date +%s)")"
          } >> "$GITHUB_STEP_SUMMARY"
