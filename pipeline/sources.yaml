# yaml-language-server: $schema=../../data-archive-kit/schema/sources.schema.json
# Lights source registry (format: archivekit, abrycta/data-archive-kit v1.1.0).
#
# Every upstream input the pipeline reads is listed here. `lgu.sources.fetch(<id>)` walks the `links`
# in order (primary first), validates each download against `checks` and the project hooks, and falls
# back to the latest validated snapshot in the private archive repo (the `archive` link).
# Satellite rasters are `remote-dataset` entries: they are processed where they live (Earth Engine) or
# read tile by tile by the pipeline's own authenticated LAADS client (lgu/laads.py), never archived.
#
# Spike decisions applied here (docs/DECISIONS.md, S2, S3, S7):
#   S2  boundaries come from HDX COD-AB v03 (pcodes "PH" + 7 digits; PSGC-10 = pcode[2:] + "000");
#       geoBoundaries is a mirror only (different schema, automatic: false).
#   S3  NOAA-20 vegetation (VJ113A1) comes from LAADS with an Earthdata login; GEE covers MODIS.
#   S7  psa.gov.ph answers a Cloudflare challenge to every automated client, so Wayback raw captures
#       (`id_` URLs, pinned timestamps) are a mirror tier, and the 2023 file was downloaded by hand and
#       adopted as the first archive snapshot (see docs/DATA.md).
version: 1
project: lgu-lights

archive:
  repo: abrycta/lgu-lights-archive
  token_env: ARCHIVE_READ_TOKEN          # fine-grained PAT: Contents read on kit + archive, Issues read/write on archive
  tag_format: "{id}-{date}"
  compression: zstd
  compression_level: auto

health:
  issue_label: source-health
  issue_title_prefix: "lgu-lights source"
  issue_token_env: ARCHIVE_READ_TOKEN
  token_expiry_warn_days: 30
  # No token_expires: ARCHIVE_READ_TOKEN was created without an expiry (2026-10-21), so the guard reports
  # "no expiry date" and passes. If the token is ever regenerated with an expiry, set token_expires here.
  # CI mints Earthdata tokens per run from EARTHDATA_USERNAME/PASSWORD; the 60-day EARTHDATA_TOKEN
  # (about 2026-12-20) is only a fallback and is not watched here.
  user_agent: "lgu-lights-pipeline/0.1 (+https://github.com/abrycta/lgu-lights)"
  heartbeat_days: 14

sources:
  # ------------------------------------------------------------------ labels (PSA Small Area Estimates)
  - id: psa-sae-2018-2021
    description: >-
      PSA city- and municipal-level Small Area Estimates of poverty incidence, the "2018 - 2021 SAE with
      PSGC, no HUC" workbook. Besides the 2018-2021 sheet it carries one sheet per round 2000-2018 (ELL);
      the pipeline reads the 2012 and 2015 sheets from it (2018 and 2021 come from the 2023 workbook,
      which also publishes standard errors).
    kind: file
    format: zip                            # an xlsx is a zip; archivekit has no xlsx handler (OPEN-QUESTIONS Q12)
    filename: psa-sae-2018-2021.xlsx
    local_path: data/raw/psa/psa-sae-2018-2021.xlsx
    licence: "CC BY (PSA OpenSTAT terms of use); coverage of this workbook by those terms not yet confirmed by PSA"
    attribution: "Philippine Statistics Authority, City and Municipal Level Small Area Poverty Estimates 2000-2021"
    cadence: once per SAE round (about every 2-3 years)
    pin: { wayback_timestamp: "20250521080034" }
    hooks: ["lgu.sources:check_sae"]
    links:
      - id: psa
        url: "https://psa.gov.ph/system/files/phdsd/2018%20-%202021%20SAE_with%20PSGC_noHUC.xlsx"
        probe_html: true                   # Cloudflare challenge page to automated clients (spike S7)
      - id: wayback
        url: "https://web.archive.org/web/20250521080034id_/https://psa.gov.ph/system/files/phdsd/2018%20-%202021%20SAE_with%20PSGC_noHUC.xlsx"
      - id: archive
        archive: true
    checks:
      bytes: { min: 500000, max: 3000000 }
      sha256: 5f3c95bb01ed45c2ec1ae7a126fa96f0ea53c12c55fd634a9b3d460a78ff1fa0
      zip_member: "xl/workbook.xml"
      member_format: xml
    archived: { enabled: true, retention: all }

  - id: psa-sae-2023
    description: >-
      PSA 2023 city- and municipal-level Small Area Estimates of poverty (Census EB; presented
      2026-02-16), Annex 1 with 2018, 2021 and 2023 estimates, CV, SE and 90 % CI. Downloaded by hand on
      2026-10-21 (psa.gov.ph blocks automated clients; no Wayback capture of the file exists) and
      adopted as the first archive snapshot.
    kind: file
    format: zip
    filename: psa-sae-2023.xlsx
    local_path: data/raw/psa/psa-sae-2023.xlsx
    licence: "CC BY (PSA OpenSTAT terms of use); coverage of this workbook by those terms not yet confirmed by PSA"
    attribution: "Philippine Statistics Authority, 2023 City and Municipal Level Small Area Estimates of Poverty"
    cadence: once
    pin:
      original_name: "2_2023 SAE_with PSGC_noHUC_06Feb2026.xlsx"
      intake: "downloaded by hand in a browser on 2026-10-21 (release manual-psa-sae-2023-20261021); adopted with pipeline/tools/adopt_manual.py"
    hooks: ["lgu.sources:check_sae"]
    links:
      - id: psa
        url: "https://psa.gov.ph/sites/default/files/phdsd/2_2023%20SAE_with%20PSGC_noHUC_06Feb2026.xlsx"
        probe_html: true
      - id: archive
        archive: true
    checks:
      bytes: { min: 200000, max: 3000000 }
      sha256: 303fb0e87bff046acaa21e3ac586f6def6b737b9082eb1f51451a887fd93a026
      zip_member: "xl/workbook.xml"
      member_format: xml
    archived: { enabled: true, retention: all }

  # ------------------------------------------------------------------ codes and population (data v5)
  - id: psa-psgc
    description: >-
      PSA Philippine Standard Geographic Code, 1st quarter 2025 publication datafile: every region,
      province, city, municipality, sub-municipality and barangay with its 10-digit PSGC, the pre-2021
      correspondence code and its 2020 Census population. The pipeline reads the 14 City of Manila
      sub-municipalities (districts), whose populations weight the district SAE figures into one figure
      for the city (lgu/labels.py, combine_districts).
    kind: file
    format: zip                            # an xlsx is a zip
    filename: psa-psgc.xlsx
    local_path: data/raw/psa/psa-psgc.xlsx
    licence: "PSA terms of use (free use with attribution)"
    attribution: "Philippine Statistics Authority, Philippine Standard Geographic Code (PSGC), 1st Quarter 2025; 2020 Census of Population and Housing"
    cadence: quarterly (the 2020 populations do not change until the next census)
    pin:
      original_name: "PSGC-1Q-2025-Publication-Datafile.xlsx"
      wayback_timestamp: "20250520193006"
      intake: "Wayback capture of the PSA file, fetched 2026-10-23 (archive release psa-psgc-2026-10-23); adopted with pipeline/tools/adopt_manual.py"
    links:
      - id: psa
        url: "https://psa.gov.ph/system/files/scd/PSGC-1Q-2025-Publication-Datafile.xlsx"
        probe_html: true                   # Cloudflare challenge page to automated clients (spike S7)
      - id: wayback
        url: "https://web.archive.org/web/20250520193006id_/https://psa.gov.ph/system/files/scd/PSGC-1Q-2025-Publication-Datafile.xlsx"
      - id: archive
        archive: true
    checks:
      bytes: { min: 2000000, max: 6000000 }
      sha256: 4ec8e492a6da1f6a155d71c90dbb693cd33c82438016ca6cb5842232a5f648d7
      zip_member: "xl/workbook.xml"
      member_format: xml
    archived: { enabled: true, retention: all }

  # ------------------------------------------------------------------ provincial poverty (FIES; model v3)
  # PSA OpenSTAT (PXWeb) tables. PXWeb returns data only to a POST with a query, so an automated GET of
  # the link gets the table's metadata, fails validation and falls back to the archive snapshot; the
  # snapshot is refreshed with pipeline/tools/fetch_openstat.py and adopted with tools/adopt_manual.py.
  # Used lagged only (the previous SAE round's provincial figure) and as a yardstick for province-level
  # accuracy; never as a same-year input (lgu/fies.py).
  - id: psa-fies-prov-2006-2015
    description: >-
      Official full-year poverty statistics (FIES): annual per capita poverty threshold, poverty incidence
      among population, CV and magnitude of poor population by region and province, 1991, 2006, 2009,
      2012 and 2015 (provinces include their highly urbanised cities). OpenSTAT table 3D/0023C3DP020.
    kind: file
    format: json
    filename: psa-fies-prov-2006-2015.json
    local_path: data/raw/psa/psa-fies-prov-2006-2015.json
    licence: "PSA OpenSTAT terms of use (free use with attribution)"
    attribution: "Philippine Statistics Authority, OpenSTAT: Annual Per Capita Poverty Threshold, Poverty Incidence and Magnitude of Poor Population by Region/Province"
    cadence: once (superseded series)
    status: archive-only   # PSA answers 403 to CI runners and re-serves the tables with other bytes; the adopted copy in the archive is served (Kurt, 2026-10-23; needs archivekit >= 1.3)
    pin:
      intake: "POST query (every value of every variable, JSON-stat 2) with pipeline/tools/fetch_openstat.py on 2026-10-21; adopted with pipeline/tools/adopt_manual.py"
    hooks: ["lgu.sources:check_fies"]       # dimensions by content, PI in [0, 100], >= 80 provinces (audit L-C8)
    links:
      - id: openstat
        url: "https://openstat.psa.gov.ph/PXWeb/api/v1/en/DB/3D/0023C3DP020.px"
        probe_contains: "Poverty Incidence"
      - id: archive
        archive: true
    checks:
      bytes: { min: 5000, max: 500000 }
      json_type: object
      contains: "Poverty Incidence among Population"
      sha256: 4ca7dfe7ecd72804689b4c0843f12c914705409ecef796c0f1dda11bb7be8c2b   # the adopted POST result; a GET only returns table metadata (see tools/fetch_openstat.py)
    archived: { enabled: true, retention: all }

  - id: psa-fies-prov-2018-2023
    description: >-
      Official full-year poverty statistics (FIES), Table 2: annual per capita poverty threshold and
      poverty incidence among population with SE, CV and 95 % CI, by region and province, 2018, 2021 and
      2023 (provinces include their highly urbanised cities). OpenSTAT table 1F/FY/0031F3DF020.
    kind: file
    format: json
    filename: psa-fies-prov-2018-2023.json
    local_path: data/raw/psa/psa-fies-prov-2018-2023.json
    licence: "PSA OpenSTAT terms of use (free use with attribution)"
    attribution: "Philippine Statistics Authority, OpenSTAT: Full Year Poverty Statistics, Table 2"
    cadence: every FIES round (about every 3 years)
    status: archive-only   # PSA answers 403 to CI runners and re-serves the tables with other bytes; the adopted copy in the archive is served (Kurt, 2026-10-23; needs archivekit >= 1.3)
    pin:
      intake: "POST query with pipeline/tools/fetch_openstat.py on 2026-10-21; adopted with pipeline/tools/adopt_manual.py"
    hooks: ["lgu.sources:check_fies"]       # dimensions by content, PI in [0, 100], >= 80 provinces (audit L-C8)
    links:
      - id: openstat
        url: "https://openstat.psa.gov.ph/PXWeb/api/v1/en/DB/1F/FY/0031F3DF020.px"
        probe_contains: "Poverty Incidence"
      - id: archive
        archive: true
    checks:
      bytes: { min: 5000, max: 500000 }
      json_type: object
      contains: "Poverty Incidence among Population"
      sha256: d83656571ffbe06dc44e396ac1a56693e68af79a0a6bb2f7ef7f0b11d5d5a4cb   # the adopted POST result; a GET only returns table metadata (see tools/fetch_openstat.py)
    archived: { enabled: true, retention: all }

  - id: psa-fies-prov-nohuc
    description: >-
      Official full-year poverty statistics (FIES), Table 2a: poverty incidence among population by
      region, province (without its highly urbanised cities) and HUC, 2018, 2021 and 2023. The yardstick
      for province-level accuracy: it covers the same towns as the SAE. OpenSTAT table 1F/FY/0041F3DF02A.
    kind: file
    format: json
    filename: psa-fies-prov-nohuc.json
    local_path: data/raw/psa/psa-fies-prov-nohuc.json
    licence: "PSA OpenSTAT terms of use (free use with attribution)"
    attribution: "Philippine Statistics Authority, OpenSTAT: Full Year Poverty Statistics, Table 2a"
    cadence: every FIES round (about every 3 years)
    status: archive-only   # PSA answers 403 to CI runners and re-serves the tables with other bytes; the adopted copy in the archive is served (Kurt, 2026-10-23; needs archivekit >= 1.3)
    pin:
      intake: "POST query with pipeline/tools/fetch_openstat.py on 2026-10-21; adopted with pipeline/tools/adopt_manual.py"
    hooks: ["lgu.sources:check_fies"]       # dimensions by content, PI in [0, 100], >= 80 provinces (audit L-C8)
    links:
      - id: openstat
        url: "https://openstat.psa.gov.ph/PXWeb/api/v1/en/DB/1F/FY/0041F3DF02A.px"
        probe_contains: "Poverty Incidence"
      - id: archive
        archive: true
    checks:
      bytes: { min: 5000, max: 500000 }
      json_type: object
      contains: "Poverty Incidence among Population"
      sha256: c2909e051fd3a5b0488bef82448fded568b68acf542282816669e83bc267714b   # the adopted POST result; a GET only returns table metadata (see tools/fetch_openstat.py)
    archived: { enabled: true, retention: all }

  # ------------------------------------------------------------------ codes and boundaries (S2)
  - id: cod-ab-phl-tables
    description: >-
      OCHA COD-AB Philippines v03 attribute tables (admin 0-4 names and pcodes, no geometry). The
      crosswalk from PSA SAE codes to the analysis vintage is built from the admin3 sheet.
    kind: file
    format: zip
    filename: phl_admin_boundaries.xlsx
    local_path: data/raw/boundaries/phl_admin_boundaries.xlsx
    licence: "Creative Commons Attribution for Intergovernmental Organisations (CC BY-IGO)"
    attribution: &codab_attr >-
      OCHA Philippines; National Mapping and Resource Information Authority (NAMRIA); Philippine
      Statistics Authority. COD-AB PHL v03 (valid on 2025-02-13), via HDX. Boundaries are indicative and
      not official.
    cadence: yearly review
    links:
      - id: hdx
        url: https://data.humdata.org/dataset/caf116df-f984-4deb-85ca-41b349d3f313/resource/159ffd3d-679f-431c-812f-b6d6f957045e/download/phl_admin_boundaries.xlsx
      - id: archive
        archive: true
    pin: { version: v03, valid_on: "2025-02-13", hdx_last_modified: "2026-05-28" }
    checks:
      bytes: { min: 5000000, max: 30000000 }
      sha256: 3fbaa5f9aab058960ec48e8c8c490b8c7e1257db911913f967d70a7497091f49
      zip_member: "xl/workbook.xml"
      member_format: xml
    archived: { enabled: true, retention: all, max_age_days: 400 }

  - id: cod-ab-phl-gdb
    description: >-
      OCHA COD-AB Philippines v03 boundaries (File Geodatabase, admin 0-4). The pipeline reads the
      admin3 layer: 1,642 cities and municipalities, including seven Special Geographic Area placeholder
      units (the eight 2024 SGA municipalities are not split out).
    kind: file
    format: zip
    filename: phl_admin_boundaries.gdb.zip
    local_path: data/raw/boundaries/phl_admin_boundaries.gdb.zip
    licence: "Creative Commons Attribution for Intergovernmental Organisations (CC BY-IGO)"
    attribution: *codab_attr
    cadence: yearly review
    hooks: ["lgu.sources:check_adm3"]
    links:
      - id: hdx
        url: https://data.humdata.org/dataset/caf116df-f984-4deb-85ca-41b349d3f313/resource/3fa0dbcf-e07d-4506-9821-ba15baa6da07/download/phl_admin_boundaries.gdb.zip
      - id: hdx-shp
        url: https://data.humdata.org/dataset/caf116df-f984-4deb-85ca-41b349d3f313/resource/4e4067d6-3fc8-4d2c-91ea-330c3d4f8e8e/download/phl_admin_boundaries.shp.zip
        automatic: false                   # same boundaries as shapefiles: a different container
      - id: geoboundaries
        url: https://www.geoboundaries.org/api/current/gbOpen/PHL/ADM3/
        automatic: false                   # different schema (shapeID, no PSGC) and a pre-2024 vintage (S2)
        probe_contains: "gbOpen"
      - id: archive
        archive: true
    pin: { version: v03, valid_on: "2025-02-13", hdx_last_modified: "2026-05-28" }
    checks:
      bytes: { min: 200000000, max: 800000000 }
      sha256: e7fc18f1383a21066ecfbe595c5c1d77375c93341dedf7284f09d66dbd28c5ad   # a new HDX version is a deliberate update
      zip_member: "*.gdb/gdb"
    archived: { enabled: true, retention: all, max_age_days: 400 }

  # ------------------------------------------------------------------ satellite rasters (never archived)
  - id: black-marble-vnp46a4
    description: >-
      NASA Black Marble yearly nighttime lights, Collection 2 (S-NPP VNP46A4), 15 arc-second linear-lat/lon
      tiles h29v07 h29v08 h30v06 h30v07 h30v08 (Philippines), layer AllAngle_Composite_Snow_Free. Read by
      lgu/laads.py with a per-run Earthdata token; zonal statistics with exactextract in GitHub Actions.
    kind: remote-dataset
    licence: "NASA open data; no restrictions"
    attribution: >-
      Roman, M.O., et al. NASA Black Marble VIIRS/NPP Lunar BRDF-Adjusted Nighttime Lights Yearly L3
      Global 15 arc-second Linear Lat Lon Grid, VNP46A4 v002, doi:10.5067/VIIRS/VNP46A4.002 (LAADS DAAC).
    cadence: yearly; S-NPP deliveries end 2026-11-02 (continuity via NOAA-20 VJ146A4)
    links:
      - id: laads-archive
        url: https://ladsweb.modaps.eosdis.nasa.gov/archive/allData/5200/VNP46A4/
        probe: https://ladsweb.modaps.eosdis.nasa.gov/api/v2/content/details/allData/5200/VNP46A4/2023/001
        probe_contains: "VNP46A4.A2023001."         # the listing is alphabetical; a probe reads only its first 64 KiB
      - id: cmr
        url: https://cmr.earthdata.nasa.gov/search/granules.json?short_name=VNP46A4&version=2
        probe: https://cmr.earthdata.nasa.gov/search/granules.json?short_name=VNP46A4&version=2&page_size=1
        probe_contains: "VNP46A4"
    archived: { enabled: false }

  - id: black-marble-vj146a4
    description: >-
      NASA Black Marble yearly nighttime lights from NOAA-20 (VJ146A4 v002, 2018 onwards): same tiles, grid,
      layer and units as black-marble-vnp46a4. lgu/laads.py reads it for 2026 onwards (S-NPP ends 2026-11-02),
      scaled onto the S-NPP series by the S-NPP/NOAA-20 ratio of the overlap year 2025 (bm_ratio).
    kind: remote-dataset
    licence: "NASA open data; no restrictions"
    attribution: >-
      Roman, M.O., et al. NASA Black Marble VIIRS/NOAA-20 Lunar BRDF-Adjusted Nighttime Lights Yearly L3
      Global 15 arc-second Linear Lat Lon Grid, VJ146A4 v002 (LAADS DAAC).
    cadence: yearly
    links:
      - id: laads-archive
        url: https://ladsweb.modaps.eosdis.nasa.gov/archive/allData/5200/VJ146A4/
        probe: https://ladsweb.modaps.eosdis.nasa.gov/api/v2/content/details/allData/5200/VJ146A4/2023/001
        probe_contains: "VJ146A4.A2023001."
      - id: cmr
        url: https://cmr.earthdata.nasa.gov/search/granules.json?short_name=VJ146A4&version=2
        probe: https://cmr.earthdata.nasa.gov/search/granules.json?short_name=VJ146A4&version=2&page_size=1
        probe_contains: "VJ146A4"
    archived: { enabled: false }

  - id: viirs-vj113a1
    description: >-
      NOAA-20 VIIRS vegetation indices, 16-day 500 m sinusoidal tiles (VJ113A1 v002): NDVI and EVI for
      years MOD13Q1 does not cover in full (Terra ends February 2027), calibrated onto MOD13Q1 per LGU
      (lgu/vegetation.py, pipeline/inputs/veg_calibration.json; Option A, 2026-10-23). Not on Earth Engine
      (spike S3): read from LAADS by lgu/laads.py; 2018 onwards.
    kind: remote-dataset
    licence: "NASA open data; no restrictions"
    attribution: >-
      Didan, K., Barreto, A. VIIRS/NOAA20 Vegetation Indices 16-Day L3 Global 500m SIN Grid, VJ113A1 v002,
      NASA EOSDIS Land Processes DAAC / LAADS DAAC.
    cadence: 16-day
    links:
      - id: laads-archive
        url: https://ladsweb.modaps.eosdis.nasa.gov/archive/allData/5200/VJ113A1/
        probe: https://ladsweb.modaps.eosdis.nasa.gov/api/v2/content/details/allData/5200/VJ113A1/2023/001
        probe_contains: "VJ113A1.A2023001."
      - id: cmr
        url: https://cmr.earthdata.nasa.gov/search/granules.json?short_name=VJ113A1&version=002
        probe: https://cmr.earthdata.nasa.gov/search/granules.json?short_name=VJ113A1&version=002&page_size=1
        probe_contains: "VJ113A1"
    archived: { enabled: false }

  - id: modis-mod13q1
    description: >-
      MODIS Terra MOD13Q1 v061 vegetation indices (NDVI), 250 m, 16-day. Reduced to yearly per-LGU means
      inside Google Earth Engine (lgu/ee_zonal.py; project lgu-lights); nothing is downloaded.
    kind: remote-dataset
    licence: "No restrictions on subsequent use, sale, or redistribution (NASA LP DAAC)"
    attribution: >-
      Didan, K. (2021). MODIS/Terra Vegetation Indices 16-Day L3 Global 250m SIN Grid V061, NASA EOSDIS
      LP DAAC, doi:10.5067/MODIS/MOD13Q1.061. Processed in Google Earth Engine.
    cadence: 16-day; Terra end of science about February 2027
    links:
      - id: earth-engine
        url: ee://MODIS/061/MOD13Q1
        probe: https://earthengine-stac.storage.googleapis.com/catalog/MODIS/MODIS_061_MOD13Q1.json
        probe_contains: "MOD13Q1"
      - id: lpdaac-cmr
        url: https://cmr.earthdata.nasa.gov/search/granules.json?short_name=MOD13Q1&version=061
        probe: https://cmr.earthdata.nasa.gov/search/granules.json?short_name=MOD13Q1&version=061&page_size=1
        probe_contains: "MOD13Q1"
        # probe only (audit L-C6): health-checked, but lgu/ee_zonal.py reads Earth Engine and never this link;
        # the kit requires two automatic links for an unarchived remote dataset, so it is not marked automatic: false
    archived: { enabled: false }

  - id: worldpop-phl-100m
    description: >-
      WorldPop Global Project population, Philippines, 100 m, unconstrained (WorldPop/GP/100m/pop, 2000-2020).
      Summed per LGU in Earth Engine; used for density and radiance per person. 2021-2023 carry 2020 forward.
    kind: remote-dataset
    licence: "CC BY 4.0"
    attribution: "WorldPop (www.worldpop.org), School of Geography and Environmental Science, University of Southampton; doi:10.5258/SOTON/WP00645"
    cadence: static (2000-2020)
    links:
      - id: earth-engine
        url: ee://WorldPop/GP/100m/pop
        probe: https://earthengine-stac.storage.googleapis.com/catalog/WorldPop/WorldPop_GP_100m_pop.json
        probe_contains: "WorldPop"
      # hub.worldpop.org and data.worldpop.org time out from GitHub Actions (lgu-lights-archive #16, audit L9):
      # the second mirror is the same dataset's HDX record (CKAN API), which Actions reaches.
      - id: hdx
        url: https://data.humdata.org/dataset/worldpop-population-counts-for-philippines
        probe: https://data.humdata.org/api/3/action/package_show?id=worldpop-population-counts-for-philippines
        probe_contains: "phl_ppp_2020"
        # probe only (audit L-C6): health-checked, but lgu/ee_zonal.py reads Earth Engine and never this link;
        # the kit requires two automatic links for an unarchived remote dataset, so it is not marked automatic: false
    archived: { enabled: false }

  - id: srtm-dem
    description: NASA SRTM 1 arc-second DEM; mean elevation and slope per LGU (static context), in Earth Engine.
    kind: remote-dataset
    licence: "Public domain (NASA/USGS)"
    attribution: "NASA JPL (2013). NASA Shuttle Radar Topography Mission Global 1 arc second, doi:10.5067/MEaSUREs/SRTM/SRTMGL1.003"
    cadence: static
    links:
